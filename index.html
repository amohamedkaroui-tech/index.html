<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Vidéo IA</title>
  <style>
    body { font-family: system-ui; background:#f5f7fb; margin:0; padding:20px; }
    .box { max-width:700px; margin:auto; background:#fff; padding:24px; border-radius:16px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
    h1 { font-size:24px; }
    textarea, input { width:100%; padding:12px; border:1px solid #ccc; border-radius:10px; margin:8px 0; box-sizing:border-box; }
    button { background:#2563eb; color:#fff; border:0; padding:12px 20px; border-radius:10px; cursor:pointer; }
    button:disabled { background:#9ca3af; cursor:not-allowed; }
    .result { background:#f3f4f6; padding:16px; border-radius:10px; white-space:pre-wrap; margin-top:16px; }
    .error { background:#fee2e2; color:#991b1b; padding:16px; border-radius:10px; margin-top:16px; white-space:pre-wrap; }
    .lang { display:flex; gap:8px; margin-bottom:16px; }
    .lang button { background:#e5e7eb; color:#111; }
    .lang button.active { background:#2563eb; color:#fff; }
    .videoBtn { background:#16a34a; margin-top:16px; }
    .note { font-size:14px; color:#555; margin-top:8px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎬 Studio Vidéo IA</h1>
    <p>استوديو الفيديو بالذكاء الاصطناعي</p>

    <div class="lang">
      <button id="btnFr" class="active" onclick="setLang('fr')">Français</button>
      <button id="btnAr" onclick="setLang('ar')">العربية</button>
    </div>

    <label>Votre clé Gemini / مفتاح Gemini</label>
    <input id="apiKey" type="password" placeholder="Collez votre clé API ici" />

    <label>Proverbe, sujet ou idée / مثل، موضوع أو فكرة</label>
    <textarea id="idea" rows="4" placeholder="Exemple : Qui sème le vent récolte la tempête"></textarea>

    <button id="genBtn" onclick="generatePrompt()">Générer le prompt / إنشاء البرومبت</button>

    <div id="status"></div>
    <div id="error" class="error" style="display:none"></div>
    <div id="result" class="result" style="display:none"></div>

    <div id="videoSection" style="display:none">
      <button class="videoBtn" onclick="openVideoGenerator()">
        🎬 Générer la vidéo / إنشاء الفيديو
      </button>
      <p class="note">
        Le prompt est copié automatiquement. Colle-le dans Hugging Face, puis clique sur Generate.
      </p>
    </div>
  </div>

<script>
  let lang = "fr";

  function setLang(l) {
    lang = l;
    document.getElementById("btnFr").classList.toggle("active", l === "fr");
    document.getElementById("btnAr").classList.toggle("active", l === "ar");
    document.body.dir = l === "ar" ? "rtl" : "ltr";
  }

  async function generatePrompt() {
    const key = document.getElementById("apiKey").value.trim();
    const idea = document.getElementById("idea").value.trim();
    const status = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const result = document.getElementById("result");
    const videoSection = document.getElementById("videoSection");
    const btn = document.getElementById("genBtn");

    errorBox.style.display = "none";
    result.style.display = "none";
    videoSection.style.display = "none";

    if (!key || idea.length < 3) {
      status.innerText = lang === "ar"
        ? "أدخل المفتاح والفكرة."
        : "Entrez la clé et votre idée.";
      return;
    }

    status.innerText = lang === "ar" ? "جارٍ الإنشاء…" : "Génération en cours…";
    btn.disabled = true;

    const instruction = `
Tu es un expert en prompts pour vidéos IA.
Transforme cette idée en UN prompt vidéo professionnel EN ANGLAIS.
Inclus : sujet, décor, personnage, action, caméra, lumière, ambiance, style cinématographique, 4K.
Réponds uniquement par le prompt final.
Idée : "${idea}"
Langue de l'utilisateur : ${lang}
`;

    try {
      const response = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": key
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: instruction }] }]
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        const message = data?.error?.message || JSON.stringify(data);
        throw new Error(message);
      }

      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;

      if (!text) {
        throw new Error("Réponse Gemini vide : " + JSON.stringify(data));
      }

      result.innerText = text.trim();
      result.style.display = "block";
      videoSection.style.display = "block";

      status.innerText = lang === "ar"
        ? "تم إنشاء البرومبت ✔"
        : "Prompt généré ✔";

    } catch (e) {
      status.innerText = "";
      errorBox.innerText = "Erreur : " + (e.message || e);
      errorBox.style.display = "block";
    } finally {
      btn.disabled = false;
    }
  }

  function openVideoGenerator() {
    const prompt = document.getElementById("result").innerText;
    navigator.clipboard.writeText(prompt);
    window.open(
      "https://huggingface.co/spaces/Wan-AI/Wan2.2-T2V-A14B",
      "_blank"
    );
  }
</script>
</body>
</html>
